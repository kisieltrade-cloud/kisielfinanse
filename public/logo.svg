<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#b14aed"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="48" height="48" fill="#080d14"/>

  <!-- Clipped corner frame -->
  <path d="M3 3 L37 3 L45 11 L45 45 L3 45 Z"
        fill="none"
        stroke="url(#g1)"
        stroke-width="1.5"/>

  <!-- Corner accent glow -->
  <path d="M37 3 L45 11"
        stroke="#00f5d4"
        stroke-width="2"
        stroke-linecap="square"
        filter="url(#glow)"/>

  <!-- Letter N — clean and bold -->
  <path d="M13 13 L13 35 L17 35 L17 20 L27 35 L31 35 L31 13 L27 13 L27 28 L17 13 Z"
        fill="url(#g1)"/>
</svg>
